<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>계정 설정</title>
<style>
  body {
    margin: 0;
    font-family: Georgia, serif;
    background: linear-gradient(135deg, #7c3aed, #a855f7);
    min-height: 100vh;
  }
  .card {
    max-width: 640px;
    margin: 37px auto;
    background: #fff;
    padding: 13px 27px;
    border-radius: 6px;
  }
  h1 { font-family: Verdana, sans-serif; font-size: 26px; margin: 7px 0 13px; }
  h4 { font-family: "Courier New", monospace; font-size: 15px; margin: 21px 0 7px; }
  .hint { color: #999; font-size: 13px; margin: 3px 0 11px; }
  .row { display: flex; align-items: center; gap: 7px; margin: 9px 0; }
  .avatar { width: 64px; height: 64px; border-radius: 50%; }
  input[type=text], input[type=email], input[type=password] {
    font-family: Arial, sans-serif; padding: 5px 7px; border: 1px solid #ddd; width: 260px;
  }
  button, .link-btn {
    font-family: Arial, sans-serif; font-size: 12px; padding: 3px 9px; height: 26px;
    border: 0; border-radius: 3px; background: #6d28d9; color: #fff; cursor: pointer;
  }
  button:focus, .link-btn:focus { outline: none; }
  .ghost { background: #eee; color: #999; }
  .danger { background: #fff; color: #e11d48; border: 1px solid #fca5a5; }
  .footer { display: flex; gap: 5px; justify-content: flex-end; margin-top: 19px; }
</style>
</head>
<body>
  <div class="card">
    <h1>⚙️ 계정 설정</h1>
    <p class="hint">프로필과 알림, 보안 설정을 바꿀 수 있어요.</p>

    <div class="row">
      <img class="avatar" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64'><rect width='64' height='64' fill='%23c4b5fd'/><circle cx='32' cy='26' r='12' fill='%23fff'/><rect x='14' y='42' width='36' height='16' rx='8' fill='%23fff'/></svg>">
      <button type="button">📷 사진 바꾸기</button>
    </div>

    <h4>👤 프로필</h4>
    <div class="row"><input type="text" placeholder="이름" value="김하늘"></div>
    <div class="row"><input type="email" placeholder="이메일" value="haneul@example.com"></div>
    <p class="hint">이메일은 로그인과 알림에 쓰여요.</p>

    <h4>🔔 알림</h4>
    <div class="row"><input type="checkbox" checked> 이메일 알림 받기</div>
    <div class="row"><input type="checkbox"> 주간 요약 받기</div>

    <h4>🔒 보안</h4>
    <div class="row"><input type="password" placeholder="새 비밀번호"></div>
    <div class="row"><a class="link-btn" href="#" role="button">비밀번호 바꾸기</a></div>

    <div class="footer">
      <button type="button" class="danger">탈퇴하기</button>
      <button type="button" class="ghost">취소</button>
      <button type="button">💾 저장</button>
    </div>
  </div>
</body>
</html>
