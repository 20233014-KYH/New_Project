<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>도구 인벤토리 와이어프레임</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
/* tastemaker stamp | 2번 확정본 전체 와이어프레임 | mood technical, palette seed 2610 (light+dark), Pretendard single family |
   screens: home, start, browse, find, tool, box, ask/1, ask/2, result, help, notes | motion: none beyond hover (app flow) */
:root{
  --text:#121c21; --bg:#f8fdff; --surface:#eaf4f8; --primary:#1a7c9e; --on-primary:#ffffff; --secondary:#bde5f7; --accent:#b3548a; --border:#d9e3e7; --mute:#4d5d65;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s6:24px; --s8:32px; --s12:48px; --s24:96px;
  --r-sm:6px; --r-md:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --text:#e6f5fb; --bg:#0e1518; --surface:#192024; --primary:#0280a5; --on-primary:#ffffff; --secondary:#0d3241; --accent:#db78af; --border:#252d30; --mute:#9db0b8;}}
:root[data-theme="dark"]{--text:#e6f5fb; --bg:#0e1518; --surface:#192024; --primary:#0280a5; --on-primary:#ffffff; --secondary:#0d3241; --accent:#db78af; --border:#252d30; --mute:#9db0b8;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard Variable",Pretendard,system-ui,sans-serif;font-size:16px;line-height:1.65;word-break:keep-all}
.n{font-variant-numeric:tabular-nums}
a{color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:3px;border-radius:var(--r-sm)}
h1:focus{outline:none}
.c{max-width:1160px;margin:0 auto;padding-left:var(--s6);padding-right:var(--s6)}
@media (max-width:600px){.c{padding-left:var(--s4);padding-right:var(--s4)}}
.mute{color:var(--mute)}
.sr{position:absolute;left:-9999px}

/* 머리 */
.nav{border-bottom:1px solid var(--border);background:var(--bg)}
.nav .c{display:flex;align-items:center;gap:var(--s4) var(--s6);min-height:64px;flex-wrap:wrap;padding-top:var(--s2);padding-bottom:var(--s2)}
.logo{display:flex;align-items:center;gap:var(--s2);font-weight:700;text-decoration:none}
.hsearch{flex:1 1 220px;max-width:360px}
.hsearch input{width:100%;font:inherit;font-size:15px;padding:8px 12px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--bg);color:var(--text)}
.nav-links{display:flex;gap:var(--s4);font-weight:500;font-size:15px;align-items:center;margin-left:auto;flex-wrap:wrap}
.nav-links a{text-decoration:none;color:var(--mute)}
.nav-links a[aria-current="page"],.nav-links a:hover{color:var(--text)}
.nav-links a.boxlink{color:var(--text);border:1px solid var(--border);border-radius:var(--r-sm);padding:5px 10px}
.pill{display:inline-block;margin-left:var(--s1);padding:0 7px;border-radius:999px;background:var(--primary);color:var(--on-primary);font-size:12.5px}

main{padding-top:var(--s8);padding-bottom:var(--s24);min-height:70vh}
h1{margin:0;font-size:clamp(26px,3.4vw,38px);line-height:1.25;letter-spacing:-0.02em}
.lead{margin:var(--s3) 0 var(--s8);color:var(--mute);max-width:42em;font-size:17px}
h2{margin:0 0 var(--s3);font-size:20px}
h3{margin:0;font-size:17px}
.btn{font:inherit;font-weight:600;border-radius:var(--r-sm);padding:11px 18px;border:1px solid var(--primary);cursor:pointer;text-decoration:none;display:inline-block;background:transparent;color:var(--primary)}
.btn-p{background:var(--primary);color:var(--on-primary)}
.btn-sm{padding:7px 14px;font-size:14px}
.row-actions{display:flex;flex-wrap:wrap;gap:var(--s3);margin-top:var(--s8);align-items:center}
.tag{font-size:12.5px;font-weight:600;padding:1px 9px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.tag.ov{color:var(--accent)} .tag.si{color:var(--primary)} .tag.co{color:var(--text)} .tag.un,.tag.no{color:var(--mute)}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:var(--s6)}
.split{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:var(--s12);align-items:start}
@media (max-width:900px){.split{grid-template-columns:1fr;gap:var(--s8)}}
.back{display:inline-block;margin-bottom:var(--s4);font-size:15px;color:var(--mute)}
.crumb{margin:0 0 var(--s2);font-size:14px;color:var(--mute)}

/* 진행 단계 */
.steps{display:flex;gap:var(--s2);list-style:none;padding:0;margin:0 0 var(--s8);flex-wrap:wrap;counter-reset:st}
.steps li{counter-increment:st;display:flex;align-items:center;gap:var(--s2);font-size:14.5px;color:var(--mute)}
.steps li:not(:last-child)::after{content:"";width:28px;height:1px;background:var(--border);margin-left:var(--s2)}
.steps li::before{content:counter(st);display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;border:1px solid var(--border);font-size:13px;font-weight:700}
.steps li.done::before{background:var(--secondary);border-color:var(--secondary);color:var(--text)}
.steps li[aria-current="step"]{color:var(--text);font-weight:700}
.steps li[aria-current="step"]::before{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}

/* 홈 검색 */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:var(--s12);align-items:start;padding-top:var(--s4)}
@media (max-width:900px){.hero{grid-template-columns:1fr;gap:var(--s8)}}
.bigsearch{position:relative;max-width:620px}
.bigsearch label{display:block;font-weight:700;margin-bottom:var(--s2)}
.bigsearch input{width:100%;font:inherit;font-size:18px;padding:14px 16px;border:2px solid var(--primary);border-radius:var(--r-md);background:var(--bg);color:var(--text)}
.hint{font-size:14px;color:var(--mute);margin:var(--s2) 0 0}
.hint button{font:inherit;font-size:14px;background:none;border:0;padding:0;color:var(--primary);text-decoration:underline;cursor:pointer}
.sugg{list-style:none;margin:var(--s2) 0 0;padding:0;border:1px solid var(--border);border-radius:var(--r-md);background:var(--bg);overflow:hidden}
.sugg:empty{display:none}
.sugg li{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);border-bottom:1px solid var(--border)}
.sugg li:last-child{border-bottom:0}
.sugg li[aria-selected="true"]{background:var(--surface)}
.sugg a{text-decoration:none;font-weight:600}
.sugg small{display:block;color:var(--mute);font-size:13px;font-weight:400}
.paths{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4);margin-top:var(--s8);max-width:620px}
@media (max-width:600px){.paths{grid-template-columns:1fr}}
.path{display:block;text-decoration:none;border:1px solid var(--border);border-radius:var(--r-md);padding:var(--s4) var(--s6)}
.path:hover{border-color:var(--primary)}
.path b{display:block}
.path span{font-size:14px;color:var(--mute)}
.how{list-style:none;padding:0;margin:0;display:grid;gap:var(--s4)}
.how li{display:grid;grid-template-columns:36px 1fr;gap:var(--s3)}
.how .num{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--primary);color:var(--on-primary);font-weight:700}
.how p{margin:0;font-size:14.5px;color:var(--mute)}
.fact{margin-top:var(--s12);border-top:1px solid var(--text);padding-top:var(--s6);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:var(--s8)}
@media (max-width:800px){.fact{grid-template-columns:1fr;gap:var(--s3)}}

/* 목록 */
.toolbar{display:flex;gap:var(--s3);flex-wrap:wrap;align-items:center;margin-bottom:var(--s4)}
.toolbar input,.toolbar select{font:inherit;font-size:15px;padding:8px 12px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--bg);color:var(--text)}
.toolbar input{flex:1 1 200px;max-width:340px}
.toolbar label{font-size:14px;color:var(--mute)}
.count{font-size:14px;color:var(--mute);margin-left:auto}
.list{border-top:1px solid var(--text)}
.item{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1fr) minmax(0,0.8fr) auto;gap:var(--s6);align-items:center;padding:var(--s4) 0;border-bottom:1px solid var(--border)}
@media (max-width:760px){.item{grid-template-columns:1fr auto;gap:var(--s2) var(--s4)}.item .i-tok,.item .i-meta{grid-column:1 / 2}.item .i-add{grid-column:2;grid-row:1}}
.i-name{font-weight:700;font-size:16.5px;text-decoration:none}
.i-repo{font-size:13px;color:var(--mute);overflow-wrap:anywhere}
.i-desc{font-size:14px;color:var(--mute);margin-top:var(--s1);max-width:52ch}
.i-tok .n{font-weight:700}
.i-tok small{display:block;color:var(--mute);font-size:12.5px}
.i-bar{height:5px;border-radius:3px;background:var(--primary);margin-top:var(--s1)}
.i-meta{font-size:13.5px;color:var(--mute)}
.clash{margin-top:var(--s2);font-size:13.5px;font-weight:600;color:var(--accent)}
.add{font:inherit;font-size:14px;font-weight:600;padding:7px 14px;border-radius:var(--r-sm);border:1px solid var(--primary);background:transparent;color:var(--primary);cursor:pointer;white-space:nowrap}
.add[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.choice{display:flex;flex-wrap:wrap;gap:var(--s2)}
.opt{font:inherit;font-size:15px;font-weight:500;padding:9px 16px;border-radius:999px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;text-decoration:none}
.opt[aria-current="page"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.empty{padding:var(--s8);color:var(--mute);border:1px dashed var(--border);border-radius:var(--r-md)}

/* 처음이에요 */
.cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s3)}
@media (max-width:800px){.cats{grid-template-columns:1fr}}
.cat{font:inherit;text-align:left;cursor:pointer;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:var(--r-md);padding:var(--s4)}
.cat b{display:block;font-size:16px}
.cat span{display:block;font-size:14px;color:var(--mute);margin-top:var(--s1)}
.cat[aria-pressed="true"]{border:2px solid var(--primary);padding:calc(var(--s4) - 1px)}
.starter{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s6);margin-top:var(--s6)}
@media (max-width:800px){.starter{grid-template-columns:1fr}}
.starter p{margin:var(--s2) 0 var(--s4);font-size:14px;color:var(--mute)}
.note{font-size:14px;color:var(--mute);margin-top:var(--s8)}

/* 상세 */
.toolhead{display:flex;justify-content:space-between;gap:var(--s6);align-items:flex-start;flex-wrap:wrap;margin-bottom:var(--s8)}
.toolhead > div{flex:1 1 420px}
.toolhead .lead{margin-bottom:0}
.banner{border:1px solid var(--accent);border-radius:var(--r-sm);padding:var(--s3) var(--s4);margin-bottom:var(--s8);font-size:15px}
.banner b{color:var(--accent)}
.spec dl{display:grid;grid-template-columns:auto 1fr;gap:var(--s2) var(--s6);margin:0;font-size:15px}
.spec dt{color:var(--mute)}
.spec dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.sb-row{display:grid;grid-template-columns:72px 1fr 52px;gap:var(--s3);align-items:center;font-size:14px;margin-top:var(--s3)}
.sb-track{height:10px;border-radius:5px;background:var(--bg);border:1px solid var(--border);overflow:hidden}
.sb-fill{height:100%;background:var(--primary)}
.big{font-size:44px;font-weight:700;letter-spacing:-0.02em;line-height:1}
.pair{display:flex;justify-content:space-between;gap:var(--s3);align-items:center;padding:var(--s3) 0;border-bottom:1px solid var(--border);font-size:15px}
.pair a{text-decoration:none;font-weight:600}
.pair small{display:block;color:var(--mute);font-size:13px}

/* 도구함 */
.status{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s6);align-items:center;padding:var(--s3) var(--s4);border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface);margin-bottom:var(--s6);font-size:15px}
.status.bad{border-color:var(--accent)}
.stack{display:flex;height:34px;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--border);margin:var(--s4) 0 var(--s2)}
.seg{height:100%;display:flex;align-items:center;padding:0 8px;font-size:12.5px;white-space:nowrap;overflow:hidden;background:var(--secondary);border-right:2px solid var(--bg)}
.seg.hot{background:var(--accent);color:var(--on-primary)}
.slots{border-top:1px solid var(--text)}
.slot{display:grid;grid-template-columns:130px 1fr;gap:var(--s4);padding:var(--s3) 0;border-bottom:1px solid var(--border);align-items:start}
@media (max-width:600px){.slot{grid-template-columns:1fr;gap:var(--s1)}}
.slot-name{font-weight:700;font-size:14.5px}
.slot-tools{display:grid;gap:var(--s2)}
.slot-tool{display:flex;justify-content:space-between;gap:var(--s3);align-items:center;font-size:15px}
.slot-tool a{font-weight:600;text-decoration:none}
.slot-empty{font-size:14px;color:var(--mute)}

/* 질문 */
.qwrap{max-width:640px}
.qcount{font-size:14px;color:var(--mute);margin:0 0 var(--s2)}
fieldset{border:0;padding:0;margin:0;min-width:0}
legend{padding:0}
legend h1{font-size:clamp(24px,3vw,32px)}
.radios{display:grid;gap:var(--s2);margin-top:var(--s6)}
.radio{display:flex;gap:var(--s3);align-items:flex-start;border:1px solid var(--border);border-radius:var(--r-md);padding:var(--s3) var(--s4);cursor:pointer}
.radio:has(input:checked){border:2px solid var(--primary);padding:calc(var(--s3) - 1px) calc(var(--s4) - 1px)}
.radio input{width:20px;height:20px;margin:3px 0 0;accent-color:var(--primary);flex:none}
.radio b{display:block}
.radio span{display:block;font-size:14px;color:var(--mute)}
.why{margin-top:var(--s6);font-size:14.5px;color:var(--mute)}
.err{color:var(--accent);font-weight:600;margin-top:var(--s4)}

/* 결과 */
.check{display:grid;grid-template-columns:auto 1fr auto;gap:var(--s2) var(--s6);margin:0 0 var(--s8);padding:var(--s4) 0;border-top:1px solid var(--text);border-bottom:1px solid var(--border);font-size:15px}
.check dt{color:var(--mute)}
.check dd{margin:0;font-weight:600}
.check a{font-size:14px;color:var(--primary)}
.reco{display:grid;gap:var(--s4)}
.reco h3{margin:0 0 var(--s2);font-size:18px}
.reco p{margin:var(--s1) 0}
.warn{color:var(--accent);font-weight:600}

/* 도움말 */
.terms{display:grid;grid-template-columns:minmax(120px,auto) 1fr;gap:var(--s3) var(--s6);margin:0;border-top:1px solid var(--text);padding-top:var(--s4)}
.terms dt{font-weight:700}
.terms dd{margin:0;color:var(--mute)}
@media (max-width:600px){.terms{grid-template-columns:1fr;gap:var(--s1)}.terms dd{margin-bottom:var(--s3)}}
details{border-bottom:1px solid var(--border);padding:var(--s3) 0}
summary{cursor:pointer;font-weight:600}
details p{margin:var(--s2) 0 0;color:var(--mute);font-size:15px}
.inline-help{margin-top:var(--s4)}
.inline-help summary{font-weight:500;color:var(--primary);font-size:15px}

/* 아래 고정 도구함 줄 */
.boxbar{position:sticky;bottom:0;z-index:5;background:var(--text);color:var(--bg)}
.boxbar .c{display:flex;align-items:center;gap:var(--s2) var(--s6);flex-wrap:wrap;min-height:56px;padding-top:var(--s2);padding-bottom:var(--s2);font-size:15px}
.boxbar .warnc{color:var(--secondary);font-weight:700}
.boxbar a{margin-left:auto;background:var(--bg);color:var(--text);text-decoration:none;font-weight:700;padding:7px 14px;border-radius:var(--r-sm)}

/* 와이어프레임 메모 */
.ann{display:none;margin:var(--s3) 0;padding:var(--s2) var(--s3);font-size:13px;line-height:1.5;border:1px dashed var(--accent);border-radius:var(--r-sm);color:var(--text);max-width:620px}
.ann b{color:var(--accent);margin-right:var(--s2)}
html.ann-on .ann{display:block}
.anntoggle{font:inherit;font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;border:1px dashed var(--accent);background:var(--bg);color:var(--accent);cursor:pointer}
.reftable{width:100%;border-collapse:collapse;font-size:15px}
.reftable th,.reftable td{text-align:left;vertical-align:top;padding:var(--s3) var(--s3) var(--s3) 0;border-bottom:1px solid var(--border)}
.reftable th{border-bottom:1px solid var(--text);font-size:14px;color:var(--mute);font-weight:600}
@media (max-width:700px){.reftable thead{display:none}.reftable tr{display:block;border-bottom:1px solid var(--border);padding:var(--s3) 0}.reftable td{display:block;border:0;padding:var(--s1) 0}}

footer{padding-top:var(--s8);padding-bottom:var(--s12);color:var(--mute);font-size:13.5px;border-top:1px solid var(--border)}
</style>
</head>
<body>
<header class="nav"><div class="c">
  <a class="logo" href="#home"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="1" y="5" width="13" height="13" rx="3" fill="var(--primary)"/><rect x="8" y="1" width="13" height="13" rx="3" fill="none" stroke="var(--accent)" stroke-width="2"/></svg>도구 인벤토리</a>
  <form class="hsearch" id="hsearch" role="search"><label class="sr" for="hq">도구 검색</label><input id="hq" type="search" placeholder="도구 이름으로 찾기" autocomplete="off"></form>
  <nav class="nav-links" id="links" aria-label="주 메뉴"></nav>
</div></header>
<main class="c" id="view"></main>
<div id="bar"></div>
<footer class="c">도움말이며 보증이 아닙니다. 토큰은 첫 응답 기준 실측(2026-10-18, Claude Code 2.1.191, 도구 없음 대비), 합계는 하나씩 잰 값의 합(계산, 최대치)이에요. 판정은 사람 검토 또는 직접 시험이에요. · <a href="#help">용어 풀이</a> · <a href="#notes">참고한 사이트</a></footer>
<script src="./data.js"></script>
<script src="./logic.js"></script>
<script>
(() => {
  const { D, byId, key, pairs, judge, recommend, Box, fmt, clean, disp, categories, catOf } = window.INV;
  const view = document.getElementById("view");
  const max = Math.max(...D.tools.map(t => t.tokens || 0));
  const measured = D.tools.filter(t => t.tokens != null).length;
  const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");

  // 조건 답 (이 탭 안에서만 유지). null = 아직 안 답함, "" = 잘 모르겠어요
  let answers = { work: null, shell: null };
  try { Object.assign(answers, JSON.parse(sessionStorage.getItem("inv-ans") || "{}")); } catch (e) { /* 저장 안 돼도 화면은 동작 */ }
  const saveAns = () => { try { sessionStorage.setItem("inv-ans", JSON.stringify(answers)); } catch (e) { /* 위와 같음 */ } };
  const Q = {
    work: { n: 1, title: "주로 무슨 일에 Claude Code를 쓰나요?", why: "버그를 고칠 때 절차를 건너뛰는 도구가 시험에서 있었어요. 하는 일에 따라 주의할 점이 달라져요.",
      opts: [["bugfix", "버그 고치기", "오류를 찾고 고치는 일이 많아요"], ["feature", "새 기능 만들기", "새 화면이나 기능을 만드는 일이 많아요"], ["logs", "큰 빌드·테스트 로그 다루기", "긴 출력을 자주 읽혀요"], ["", "잘 모르겠어요", "주의할 점을 모두 보여 드려요"]] },
    shell: { n: 2, title: "Claude가 명령을 어디서 실행하나요?", why: "Windows에서 PowerShell로 실행하면 작동하지 않는 도구가 시험에서 있었어요.",

        <div class="row-actions"><button class="btn btn-p" type="submit">${q.n === 1 ? "다음" : "결과 보기"}</button></div></form>
        ${ann("D · GOV.UK", "한 화면에 질문 하나, 맨 위 뒤로 링크, 왜 묻는지 힌트 문장. 안 고르고 넘어가면 무엇을 하라는지 알려 줌.")}</div>`; },
    result() { const ids = Box.list();
      if (!ids.length) return `${steps(3)}<h1 tabindex="-1">결과</h1><div class="empty">도구함이 비어 있어요. <a href="#home">도구를 담고</a> 다시 와 주세요.</div>`;
      const r = recommend(ids, answers);
      return `${steps(3)}<h1 tabindex="-1">결과</h1><p class="lead">담은 도구 ${ids.length}개, 판정한 쌍 ${r.pairs.length - r.unknownCount}개, 확인된 정보 없는 쌍 ${r.unknownCount}개를 기준으로 했어요.</p>
        <dl class="check"><dt>담은 도구</dt><dd>${names(ids)}</dd><dd><a href="#box">바꾸기</a></dd><dt>주로 하는 일</dt><dd>${ansLabel("work")}</dd><dd><a href="#ask/1">바꾸기</a></dd><dt>명령 실행</dt><dd>${ansLabel("shell")}</dd><dd><a href="#ask/2">바꾸기</a></dd></dl>
        ${ann("D · GOV.UK 답 확인", "결과 위에 고른 내용을 한 번 더 보여 주고, 줄마다 바꾸기 링크.")}
        ${stack(ids)}
        <div class="split" style="margin-top:var(--s8)"><div class="reco"><h2>빼면 좋은 것</h2>${r.remove.length ? r.remove.map(x => `<div class="panel"><h3>${disp(byId[x.tool])} 빼기</h3><p>${disp(byId[x.keep])}와 겹쳐요(${x.review}). 빼면 처음 읽는 양 <b class="n">−${fmt(x.save)}</b>(계산).</p></div>`).join("") : `<div class="empty">겹치는 쌍이 없어서 뺄 것을 찾지 못했어요.</div>`}
        <h2 style="margin-top:var(--s8)">더해 볼 만한 것</h2>${r.add.map(x => `<div class="panel"><h3>${disp(byId[x.tool])}</h3><p>${x.effect}</p>${x.warnings.map(w => `<p class="warn">${w}</p>`).join("")}${x.warnings.length ? "" : `<p class="mute">주의: ${x.caution}</p>`}${x.unknown.length ? `<p class="mute">${names(x.unknown)}와는 아직 판정하지 않았어요.</p>` : ""}<p><span class="tag ${x.blocked || x.warnings.length ? "ov" : "si"}">${x.verdict}</span> <span class="mute" style="font-size:13px">직접 시험 · ${x.date}</span></p></div>`).join("") || `<div class="empty">시험한 후보가 이미 도구함에 있어요.</div>`}</div>
        <aside class="panel"><h2 style="font-size:16px">이렇게 골랐어요</h2><p class="mute" style="font-size:14.5px">1. 쌍마다 저장된 판정을 찾아요.<br>2. 겹치는 쌍은 처음 읽는 양이 큰 쪽을 빼자고 해요.<br>3. 더하기는 직접 시험해서 효과를 잰 도구만 보여 주고, 답하신 조건에 걸리는 주의를 붙여요.</p><p class="mute" style="font-size:13.5px">도움말이며 보증이 아니에요. 실제로 빼기 전에 그 도구로만 하던 일이 있는지 확인하세요.</p></aside></div>`; },
    help() {
      return `<h1 tabindex="-1">용어 풀이</h1><p class="lead">화면에 나오는 낱말을 한곳에 모았어요.</p>
        <dl class="terms"><dt>처음 읽는 양</dt><dd>도구를 켜면 대화를 시작할 때 Claude가 도구 설명을 먼저 읽어요. 도구 하나만 켜고 첫 응답에서 늘어난 토큰을 쟀어요(실측).</dd>
        <dt>최대 +n토큰</dt><dd>하나씩 잰 값을 더한 계산이에요. 실제로 같이 켜면 이보다 적거나 같아요.</dd>
        <dt><span class="tag ov">겹침</span></dt><dd>비슷한 일을 하는 도구 쌍이에요. 같이 켜면 설명을 둘 다 읽어서 토큰만 늘 수 있어요.</dd>
        <dt><span class="tag si">상황따라</span></dt><dd>하는 일에 따라 둘 다 쓸모 있거나 하나만 쓰일 수 있어요.</dd>
        <dt><span class="tag co">보완</span></dt><dd>서로 다른 일을 해서 같이 쓰면 좋아요.</dd>
        <dt><span class="tag no">확인된 정보 없음</span></dt><dd>아직 판정하지 않은 쌍이에요. 안전하다는 뜻이 아니에요.</dd>
        <dt>직접 시험 / 사람 검토</dt><dd>직접 시험은 같은 과제를 여러 번 돌려 잰 것, 사람 검토는 팀원이 기능을 읽고 판정한 것이에요.</dd></dl>
        <h2 style="margin-top:var(--s12)">자주 묻는 질문</h2>
        <details><summary>제 도구가 목록에 없어요</summary><p>지금은 직접 잰 ${D.tools.length}개만 있어요. 목록에 없는 도구는 판정하지 않아요.</p></details>
        <details><summary>추천대로 빼도 되나요?</summary><p>도움말이에요. 빼기 전에 그 도구로만 하던 일이 있는지 확인하세요.</p></details>
        <details><summary>제가 담은 도구는 어디에 저장되나요?</summary><p>이 브라우저 탭 안에만 있어요. 탭을 닫으면 사라지고, 서버로 보내지 않아요.</p></details>`;
    },
    notes() {
      const R = [["A", "PCPartPicker (pcpartpicker.com)", "부품을 고르는 순간 호환되지 않으면 경고, 목록 위 호환성 한 줄 요약, 부품 종류별 칸", "목록 줄의 겹침 경고, 도구함 상태 줄, 분야별 칸"],
        ["B", "Bundlephobia (bundlephobia.com)", "첫 화면 검색창 하나, 패키지 이름을 치면 크기(비용) 숫자가 바로 나옴", "홈 큰 검색창, 처음 읽는 양을 보여 주는 자동 완성"],
        ["C", "VS Code 확장 마켓 (공식 문서)", "목록 한 줄 = 이름·만든 곳·짧은 설명·숫자, 상세 화면에 설치 버튼과 정보 칸", "목록 줄 구성, 상세 제목 옆 담기 버튼, 오른쪽 정보 칸"],
        ["D", "GOV.UK 디자인 시스템 (질문 화면, 답 확인)", "한 화면에 질문 하나, 맨 위 뒤로 링크, 힌트 문장, 답 확인과 바꾸기 링크", "조건 두 가지를 화면 두 개로 나눔, 결과 위 답 확인 줄"],
        ["E", "Nielsen Norman Group (빈 상태 글)", "강제 튜토리얼보다 그 자리 도움말이 기억에 잘 남음, 빈 화면에서 다음 할 일 안내", "낱말 옆 펼쳐 보는 풀이, 도구함이 비었을 때 할 일 버튼"],
        ["F", "Appcues 온보딩 패턴 정리 (Headspace·Behance 예)", "처음 온 사람이 목적을 스스로 고름, 진행 표시", "홈의 두 갈래, 처음이에요 분야 고르기, 담기 → 조건 → 결과 진행 단계"],
        ["G", "일반 쇼핑몰 장바구니 (따로 조사 안 함)", "어느 화면에서든 담은 개수와 합계가 보임", "아래 고정 도구함 줄"]];
      return `<h1 tabindex="-1">참고한 사이트</h1><p class="lead">처음 보는 사람이 쓰기 쉽게 하려고 다른 사이트가 쓰는 방식을 빌렸어요. 화면 곳곳의 점선 메모 글자(A~F)가 아래 줄과 맞아요. 조사일 2026-10-27, 각 사이트의 소개·안내 문서를 검색으로 확인했어요.</p>
        <table class="reftable"><thead><tr><th>표시</th><th>참고한 곳</th><th>그곳이 하는 방식</th><th>여기서 쓴 곳</th></tr></thead><tbody>${R.map(r => `<tr>${r.map((x, i) => `<td>${i === 0 ? `<b class="warn">${x}</b>` : x}</td>`).join("")}</tr>`).join("")}</tbody></table>
        <p class="note">기획(판정 규칙, 추천 규칙, 화면에 쓰는 숫자)은 바꾸지 않았어요. 화면 순서와 안내만 바꿨어요.</p>`;
    },
  };

  const LINKS = [["start", "처음이에요"], ["browse/1", "둘러보기"], ["help", "용어 풀이"]];
  const NOBAR = ["box", "ask", "result"];
  const pill = () => { const p = document.querySelector(".boxlink .pill"); if (p) p.textContent = Box.list().length; };
  function drawBrowseList() {
    const el = document.getElementById("blist"); if (!el) return;
    const cid = (catOf(+location.hash.split("/")[1]) || catOf(1)).id, q = browseQ.trim().toLowerCase();
    const list = D.tools.filter(t => t.category === cid && (!q || hay(t).includes(q)))
      .sort((a, b) => browseSort === "tokens" ? (a.tokens ?? 1e9) - (b.tokens ?? 1e9) : b.stars - a.stars);
    el.innerHTML = list.map(row).join("") || `<div class="empty" style="margin-top:var(--s4)">이 분야에서 "${esc(browseQ)}"와 맞는 도구가 없어요.</div>`;
    document.getElementById("bcount").textContent = `${list.length}개`;
  }
  function drawBar(name) {
    const ids = Box.list(), bar = document.getElementById("bar");
    if (!ids.length || NOBAR.includes(name)) { bar.innerHTML = ""; return; }
    const ov = judge(ids).filter(p => p.relation === "overlap").length;
    bar.innerHTML = `<div class="boxbar" role="region" aria-label="도구함 요약"><div class="c"><span>도구함 <b class="n">${ids.length}</b>개</span><span class="n">같이 켜면 최대 +${fmt(Box.sum())}토큰</span>${ov ? `<span class="warnc">겹침 ${ov}쌍</span>` : ""}<a href="#box">도구함 보기 →</a></div></div>`;
  }
  let first = true, cur = "home";
  function render(keepFocus) {
    const [name, arg] = (location.hash.slice(1) || "home").split("/");
    cur = S[name] ? name : "home";
    document.getElementById("links").innerHTML = LINKS.map(([h, l]) => `<a href="#${h}" ${h.split("/")[0] === cur ? 'aria-current="page"' : ""}>${l}</a>`).join("")
      + `<a class="boxlink" href="#box" ${cur === "box" ? 'aria-current="page"' : ""}>내 도구함<span class="pill n">${Box.list().length}</span></a>`
      + `<button class="anntoggle" id="anntoggle" type="button" aria-pressed="${annOn}">${annOn ? "메모 숨기기" : "메모 보기"}</button>`;
    document.getElementById("hsearch").style.display = cur === "home" ? "none" : "";
    view.innerHTML = S[cur](arg);
    drawBrowseList(); drawBar(cur); wire();
    if (!keepFocus && !first) { const h = view.querySelector("h1"); if (h) h.focus({ preventScroll: true }); }
    first = false;
  }
  function wire() {
    const q = document.getElementById("q");
    if (q) { const ul = document.getElementById("sugg"); let sel = -1;
      const open = () => q.setAttribute("aria-expanded", !!ul.querySelector("[role=option]"));
      q.addEventListener("input", () => { searchQ = q.value; ul.innerHTML = sugg(searchQ); sel = -1; q.removeAttribute("aria-activedescendant"); open(); });
      q.addEventListener("keydown", e => { const opts = [...ul.querySelectorAll("[role=option]")];
        if (e.key === "ArrowDown" || e.key === "ArrowUp") { if (!opts.length) return; e.preventDefault(); sel = (sel + (e.key === "ArrowDown" ? 1 : -1) + opts.length) % opts.length;
          opts.forEach((o, i) => o.setAttribute("aria-selected", i === sel)); q.setAttribute("aria-activedescendant", opts[sel].id); }
        else if (e.key === "Enter") { e.preventDefault(); if (sel >= 0) location.hash = opts[sel].querySelector("a").getAttribute("href"); else if (searchQ.trim()) location.hash = "#find"; } });
      open(); }
    const bq = document.getElementById("bq"), bs = document.getElementById("bs");
    if (bq) bq.addEventListener("input", () => { browseQ = bq.value; drawBrowseList(); });
    if (bs) bs.addEventListener("change", () => { browseSort = bs.value; drawBrowseList(); });
    const f = document.getElementById("qform");
    if (f) f.addEventListener("submit", e => { e.preventDefault(); const v = f.querySelector("input:checked");
      if (!v) { document.getElementById("qerr").hidden = false; f.querySelector("input").focus(); return; }
      answers[f.dataset.k] = v.value; saveAns(); location.hash = f.dataset.k === "work" ? "#ask/2" : "#result"; });
  }
  document.getElementById("hsearch").addEventListener("submit", e => { e.preventDefault(); searchQ = document.getElementById("hq").value; if (location.hash === "#find") render(); else location.hash = "#find"; });
  document.addEventListener("click", e => {
    const a = e.target.closest("[data-add]");
    if (a) { Box.toggle(a.dataset.add);
      // 홈 검색과 둘러보기는 입력 중인 글자를 잃지 않게 그 부분만 다시 그림
      const sg = document.getElementById("sugg"), bl = document.getElementById("blist");
      if (sg && sg.contains(a)) { sg.innerHTML = sugg(searchQ); drawBar(cur); pill(); return; }
      if (bl && bl.contains(a)) { drawBrowseList(); drawBar(cur); pill(); return; }
      render(true); return; }
    const s = e.target.closest("[data-start]"); if (s) { startCat = +s.dataset.start; render(true); return; }
    if (e.target.closest("[data-demo]")) { Box.clear(); ["superpowers", "ecc", "caveman"].forEach(Box.toggle); if (location.hash === "#box") render(); else location.hash = "#box"; return; }
    if (e.target.closest("[data-clear]")) { Box.clear(); render(true); }
  });
  // 와이어프레임 메모(점선 상자) 켜고 끄기
  const setAnn = on => { annOn = on; document.documentElement.classList.toggle("ann-on", on); const tg = document.getElementById("anntoggle");
    if (tg) { tg.setAttribute("aria-pressed", on); tg.textContent = on ? "메모 숨기기" : "메모 보기"; }
    try { localStorage.setItem("inv-ann", on ? "1" : "0"); } catch (e) { /* 저장 안 돼도 됨 */ } };
  document.addEventListener("click", e => { if (e.target.closest("#anntoggle")) setAnn(!annOn); });
  try { annOn = localStorage.getItem("inv-ann") !== "0"; } catch (e) { /* 기본은 켬 */ }
  setAnn(annOn);
  addEventListener("hashchange", () => { if (!location.hash.startsWith("#browse")) browseQ = ""; render(); scrollTo(0, 0); });
  render();
})();
</script>
</body>
</html>
