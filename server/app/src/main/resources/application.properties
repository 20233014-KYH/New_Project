spring.application.name=inventory
# 기본은 local(내장 H2 메모리 DB, 설치·비밀번호 없이 바로 실행). MySQL은 --spring.profiles.active=mysql
spring.profiles.default=local
spring.jpa.open-in-view=false
# 화면(Vite 개발 서버)이 부를 수 있는 주소 패턴. 기본은 내 컴퓨터(localhost)의 아무 포트. 배포할 때는 실제 주소로 바꾼다
app.cors.origins=http://localhost:[*],http://127.0.0.1:[*]
