# 실제 MySQL. 비밀번호는 파일에 쓰지 않고 환경변수로만 받는다(DB_PASSWORD).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/inventory?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:inventory}
spring.datasource.password=${DB_PASSWORD}
# 표가 없으면 만들고, 있으면 맞춰 고침(데이터는 지우지 않음)
spring.jpa.hibernate.ddl-auto=update
