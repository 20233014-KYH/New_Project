<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Plango – Sign In</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --primary:#0066ff;
    --primary-dark:#004ecc;
    --bg:#f5f7fa;
    --card:#fff;
    --text:#333;
    --error:#d93025;
    --border:#ccc;
    --radius:8px;
    --shadow:0 4px 12px rgba(0,0,0,0.08);
    --transition:.2s ease;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:system-ui,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:1rem;
  }
  .card{
    background:var(--card);
    padding:2rem;
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    width:100%;
    max-width:380px;
  }
  h1{
    font-size:1.8rem;
    margin-bottom:1.5rem;
    text-align:center;
    color:var(--primary);
  }
  .field{
    margin-bottom:1rem;
  }
  label{
    display:block;
    font-size:.9rem;
    margin-bottom:.3rem;
  }
  input[type="email"],
  input[type="password"]{
    width:100%;
    padding:.6rem 1rem;
    border:1px solid var(--border);
    border-radius:var(--radius);
    font-size:1rem;
    transition:border var(--transition);
  }
  input:focus{
    outline:none;
    border-color:var(--primary);
  }
  .checkbox{
    display:flex;
    align-items:center;
    gap:.5rem;
    margin-bottom:1rem;
    font-size:.9rem;
  }
  .actions{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:1.5rem;
    font-size:.9rem;
  }
  .actions a{
    color:var(--primary);
    text-decoration:none;
  }
  .actions a:hover{
    text-decoration:underline;
  }
  button{
    width:100%;
    padding:.8rem;
    background:var(--primary);
    color:#fff;
    border:none;
    border-radius:var(--radius);
    font-size:1rem;
    cursor:pointer;
    transition:background var(--transition);
  }
  button:hover{background:var(--primary-dark);}
  .error{
    color:var(--error);
    font-size:.85rem;
    margin-top:.4rem;
    display:none;
  }
  .footer{
    text-align:center;
    font-size:.9rem;
  }
  .footer a{
    color:var(--primary);
    text-decoration:none;
  }
  .footer a:hover{
    text-decoration:underline;
  }
  @media (max-width:400px){
    .card{padding:1.5rem;}
    h1{font-size:1.5rem;}
  }
</style>
</head>
<body>
<div class="card">
  <h1>Plango</h1>
  <form id="loginForm" novalidate>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" required placeholder="you@example.com">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" required placeholder="••••••••">
      <div class="error" id="errorMsg">Incorrect email or password.</div>
    </div>
    <div class="checkbox">
      <input type="checkbox" id="remember">
      <label for="remember">Remember me</label>
    </div>
    <div class="actions">
      <a href="#" id="forgotLink">Forgot password?</a>
    </div>
    <button type="submit">Sign In</button>
    <div class="footer">
      Don’t have an account? <a href="#" id="signupLink">Create one</a>
    </div>
  </form>
</div>

<script>
  (function(){
    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const errorMsg = document.getElementById('errorMsg');

    // Simple mock validation – password must be "password123"
    form.addEventListener('submit', function(e){
      e.preventDefault();
      // Reset error
      errorMsg.style.display = 'none';
      // Basic email check
      const emailValid = emailInput.value.trim().includes('@');
      const passwordValid = passwordInput.value === 'password123';
      if(emailValid && passwordValid){
        alert('Welcome to Plango! (Mock login successful)');
        // Here you would normally redirect or handle auth token
        form.reset();
      }else{
        errorMsg.style.display = 'block';
        passwordInput.focus();
      }
    });

    // Optional: clear error when user starts typing again
    passwordInput.addEventListener('input',()=>{errorMsg.style.display='none';});
    emailInput.addEventListener('input',()=>{errorMsg.style.display='none';});

    // Dummy handlers for links (prevent navigation)
    document.getElementById('forgotLink').addEventListener('click',e=>{e.preventDefault();alert('Password reset flow not implemented.');});
    document.getElementById('signupLink').addEventListener('click',e=>{e.preventDefault();alert('Sign‑up flow not implemented.');});
  })();
</script>
</body>
</html>
