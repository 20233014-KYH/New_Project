<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Plango – Sign In</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --color-bg: #0D1B2A;
    --color-surface: #F0F4F8;
    --color-primary: #3E92CC;
    --color-primary-dark: #2b6c9a;
    --color-error: #D9534F;
    --color-text: #212529;
    --radius: 0.5rem;
    --gap: 1rem;
    --font-base: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-heading: "Georgia", serif;
  }

  * { box-sizing: border-box; margin:0; padding:0; }
  html,body { height:100%; font-family: var(--font-base); background: var(--color-bg); color: var(--color-text); }
  body { display:flex; align-items:center; justify-content:center; padding: var(--gap); }

  .login-card {
    background: var(--color-surface);
    border-radius: var(--radius);
    width: 100%;
    max-width: 380px;
    padding: calc(var(--gap)*2);
    box-shadow: 0 8px 24px rgba(0,0,0,.12);
    display:flex;
    flex-direction:column;
    gap: var(--gap);
    animation: fadeIn .4s ease-out;
  }

  @keyframes fadeIn {
    from { opacity:0; transform:translateY(10px); }
    to { opacity:1; transform:none; }
  }

  h1 {
    font-family: var(--font-heading);
    font-size: 1.8rem;
    margin-bottom: 0.2rem;
    color: var(--color-bg);
    text-align:center;
  }

  .subtitle {
    font-size:0.9rem;
    text-align:center;
    color:#555;
    margin-bottom: var(--gap);
  }

  .form-group {
    position:relative;
    display:flex;
    flex-direction:column;
    gap:0.25rem;
  }

  label {
    font-size:0.85rem;
    font-weight:600;
    color:#333;
    padding-left:0.3rem;
  }

  input[type="email"],
  input[type="password"] {
    border: 2px solid #cbd5e0;
    border-left: 4px solid var(--color-primary);
    border-radius: var(--radius);
    padding: 0.6rem 0.8rem;
    font-size: 1rem;
    transition: border-color .2s;
  }

  input:focus {
    outline:none;
    border-color: var(--color-primary-dark);
    border-left-color: var(--color-primary-dark);
    box-shadow: 0 0 0 3px rgba(62,146,204,.2);
  }

  .error {
    color: var(--color-error);
    font-size:0.85rem;
    margin-top:0.2rem;
  }

  .options {
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:0.85rem;
  }

  .options a {
    color: var(--color-primary);
    text-decoration:none;
    border-bottom:1px solid transparent;
    transition:border-bottom .2s;
  }

  .options a:hover,
  .options a:focus {
    border-bottom-color: var(--color-primary);
  }

  .remember {
    display:flex;
    align-items:center;
    gap:0.4rem;
  }

  .remember input {
    width:1rem;
    height:1rem;
  }

  button {
    background: var(--color-primary);
    color:#fff;
    border:none;
    border-radius: var(--radius);
    padding:0.75rem;
    font-size:1rem;
    font-weight:600;
    cursor:pointer;
    transition:background .2s;
  }

  button:hover,
  button:focus {
    background: var(--color-primary-dark);
  }

  .footer {
    text-align:center;
    font-size:0.85rem;
    margin-top: var(--gap);
  }

  .footer a {
    color: var(--color-primary);
    text-decoration:none;
    border-bottom:1px solid transparent;
  }

  .footer a:hover,
  .footer a:focus {
    border-bottom-color: var(--color-primary);
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>
  <section class="login-card" aria-labelledby="login-title">
    <h1 id="login-title">Plango</h1>
    <p class="subtitle">Team planning made simple</p>
    <form id="login-form" novalidate>
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
        <p class="error" id="error-msg" hidden>Incorrect password. Please try again.</p>
      </div>
      <div class="options">
        <div class="remember">
          <input type="checkbox" id="remember" name="remember">
          <label for="remember">Remember me</label>
        </div>
        <a href="#" id="forgot-link">Forgot password?</a>
      </div>
      <button type="submit">Sign in</button>
    </form>
    <p class="footer">Don’t have an account? <a href="#" id="signup-link">Create one</a></p>
  </section>

<script>
document.getElementById('login-form').addEventListener('submit', function(e){
  e.preventDefault();
  const pwd = document.getElementById('password').value;
  const errorEl = document.getElementById('error-msg');
  // Dummy check – the real app would call an API.
  if(pwd !== 'letmein') {
    errorEl.hidden = false;
    document.getElementById('password').setAttribute('aria-invalid','true');
    document.getElementById('password').focus();
  } else {
    errorEl.hidden = true;
    alert('Welcome to Plango!');
    // In a real app, redirect or load the dashboard.
  }
});
</script>
</body>
</html>
