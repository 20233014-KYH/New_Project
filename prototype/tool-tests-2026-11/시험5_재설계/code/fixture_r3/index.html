<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>오늘 할 일</title>
<style>
  body { font-family: sans-serif; max-width: 480px; margin: 40px auto; }
  li { display: flex; gap: 8px; align-items: center; padding: 4px 0; }
  li.done span { text-decoration: line-through; color: #888; }
  .tabs button[aria-pressed="true"] { font-weight: bold; }
</style>
</head>
<body>
<h1>오늘 할 일</h1>
<form id="f">
  <label>새 할 일 <input id="new" autocomplete="off"></label>
  <button type="submit">추가</button>
</form>
<div class="tabs" role="group" aria-label="보기">
  <button type="button" data-f="all" aria-pressed="true">전체</button>
  <button type="button" data-f="active" aria-pressed="false">진행 중</button>
  <button type="button" data-f="done" aria-pressed="false">완료</button>
</div>
<ul id="list"></ul>
<p id="left"></p>
<script src="app.js"></script>
</body>
</html>
